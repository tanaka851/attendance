<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン - 勤怠管理システム</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 80vh; }
        .box { border: 1px solid #333; padding: 30px; border-radius: 5px; width: 320px; text-align: center; }
        select, button { width: 100%; padding: 8px; margin-top: 15px; font-size: 14px; }
        button { cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="box">
    <h2>勤怠管理 ログイン</h2>
    <p>ログインする社員を選択してください</p>
    <form th:action="@{/login}" method="post">
        <select name="employeeId">
            <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="|${emp.employeeNo}: ${emp.name} (${emp.department})|"></option>
        </select>
        <button type="submit">ログイン</button>
    </form>
</div>

</body>
</html>
